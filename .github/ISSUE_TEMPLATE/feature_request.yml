name: Feature request
description: Propose a change or addition
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the situation that is currently difficult or impossible.
        Proposals grounded in a concrete problem are easier to evaluate than
        proposals grounded in a solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other approaches you looked at, and why they were not sufficient.
        Including a rejected option is often more useful than omitting it.
    validations:
      required: false

  - type: dropdown
    id: breaking
    attributes:
      label: Is this a breaking change?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: false
