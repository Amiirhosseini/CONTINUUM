name: Bug report
description: Report incorrect or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please complete every required field. Reports that cannot be
        reproduced from the information given usually cannot be acted on.

        Do not use this form for security vulnerabilities. See
        [SECURITY.md](https://github.com/Cyrax321/CONTINUUM/blob/main/SECURITY.md) for private disclosure.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues for a duplicate
          required: true
        - label: I am reporting this against the correct repository
          required: true
        - label: I am using a supported Python version (3.11 or later)
          required: true
        - label: I can reproduce this on the latest commit on `main`
          required: true

  - type: textarea
    id: environment
    attributes:
      label: System information
      description: Operating system, Python version, package version, and how it was installed.
      placeholder: |
        OS: macOS 15.2 / Ubuntu 24.04
        Python: 3.12.4
        continuum-agent: 0.1.0 (or commit SHA if from source)
        Installed via: pip / uv pip install -e . / from source
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Command or code to reproduce
      description: >
        The exact command or a minimal script. Prefer something that can be run
        as-is over a description of what was done.
      render: shell
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: What happens, including the exact error message or exit code.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected instead, and why.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or CI run
      description: >
        Full output, a stack trace, or a link to a failing CI run. Paste inline
        or attach a file. Truncated output often removes the relevant part.
      render: shell
    validations:
      required: false
