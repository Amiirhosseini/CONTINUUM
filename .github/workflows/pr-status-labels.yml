name: PR Status Labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]

jobs:
  update-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Sync status labels
        uses: actions/github-script@v7
        with:
          script: |
            const THANK_YOU_MESSAGES = [
              '**Momo** 🍑: Your PR got approved, and Momo is doing her happy peach dance right now! Thank you for building with us. Seriously, be proud of this one.',
              '**Hana** 🌸: Petals everywhere, because your PR passed! Thanks for tending this garden with us. It really is prettier because of you.',
              '**Yui** 🎀: Yui checked your work twice, and she is very hard to impress. Approved! Thank you for the care you put into this. Walk tall today.',
              '**Saki** 🌷: Approved from the very first diff! Thanks for bringing us work worth smiling about. We saved you a good seat for next time.',
              '**Rin** 🐱: Nyaa~ approved! Rin purred through the whole review. Thank you for the code treats, and please bring more!',
              '**Mei** ☕: Mei poured a fresh cup of tea in your honor tonight. Thank you for being patient and thorough. People like you make reviews a joy.',
              '**Hina** ☀️: The sun came out just for your approval! Hina is grateful for warm contributors like you. Come shine again soon, okay?',
              '**Aoi** 💙: Aoi read every line twice and found honest, careful work. Thank you for making this project better for everyone who touches it next.',
              '**Riko** 🎵: La la laaa~ approved! Riko thanks you with a tiny victory song. Every PR of yours adds a happy note to our melody.',
              '**Nana** 🍡: The whole dango stick, all five, just for you! That is how Nana says thank you around here. Enjoy, you earned it.',
              '**Miko** ⛩️: Miko drew a fortune for your PR: skillful hands, kind heart, bright future. Thank you for proving the spirits right.',
              '**Sakura** 🌸: Your branch bloomed from seed to flower, and Sakura watched the whole thing. Thank you for growing with us. Feel proud of this season.',
              '**Tsumugi** 🧶: Your changes are knitted into the community blanket now, row by row. Thank you for stitching with us. It is warmer because of you.',
              '**Kanna** 👓: Kanna inspected every hunk and found nothing to fuss about. Approved! Thank you for making her job easy, she rarely says that.',
              '**Chibi** 🌱: Chibi knew it was good code right away! Thanks for helping a little sprout grow big. Come back soon, promise?',
              '**Xiaomei** 🐼: Xiaomei rolled clean across the bamboo grove when your PR passed! Thank you, thank you. Days like this taste sweeter than fresh shoots.',
              '**Meimei** 🀄: Beautiful work, like fresh snow on quiet mountains. Big sister approves and says thank you. She is never wrong about these things.',
              '**Baozi** 🥟: Steamed, stuffed, stamped approved! Two warm buns for you, on the house. Thank you for feeding this project so well.',
              "**Lulu** 🦊: Lulu's sharp fox eyes found nothing to fix. Approved! Thank you for joining the clever ones in this den. Return soon.",
              '**Niuniu** 🐄: Niuniu galloped the whole pasture for you today! Mooooved straight to approval. Thanks for making her run, wear it proudly!',
              '**Doufu** ♨️: Soft outside, solid inside, just like your code. Doufu stands and salutes you. Thank you, he does not do that for everyone!',
              '**Tangyuan** 🍡: Tangyuan rolled joyful circles around the CI logs! Thank you for gathering with the family again. Stay close, okay?',
              '**Boba** 🥛: Boba slurped the entire test suite and found only pearls. Approved! Extra tapioca for you, with thanks from the whole tea shop.',
              '**Xiaohua** 🌺: Your name just got planted in the contributor garden! Xiaohua thanks you kindly. It grows a little every time you visit.',
              '**Kiki** 🐰: Bounced around the merge queue three times! Approved, approved, approved! Thank you for hopping by, the queue already misses you.',
              '**Yuzu** 🍋: A little zesty, a lot approved! Yuzu thanks you for bright work on a cloudy day. Here is a whole sunny one, just for you.',
              '**Mochi** 🍡: Soft landing, straight to approved! Mochi stuck with your PR from the first commit. Sticky sweet thanks for seeing it through!',
              "**Anko** ☕: Extra red bean scoop in today's tea, because approved PRs deserve real celebration. Thank you for brewing something good with us.",
              '**Sumi** 🖍️: Sumi inked a bold approval circle around your name in the record book. Thank you for giving us something worth remembering.',
            ];

            const { owner, repo } = context.repo;
            const isReview = context.eventName === "pull_request_review";
            // Both event payloads carry the PR at payload.pull_request
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            let addLabel;
            let removeLabels;

            if (isReview) {
              const state = context.payload.review.state;
              if (state === "approved") {
                addLabel = "ready to merge";
                removeLabels = ["awaiting review", "changes requested"];
                await thankContributor(pr);
              } else if (state === "changes_requested") {
                addLabel = "changes requested";
                removeLabels = ["awaiting review", "ready to merge"];
              } else {
                // COMMENT reviews do not change approval status
                return;
              }
            } else {
              const action = context.payload.action;
              if (action === "synchronize") {
                // New commits pushed: approval no longer reflects HEAD
                addLabel = null;
                removeLabels = ["ready to merge"];
              } else {
                // opened or reopened
                addLabel = "awaiting review";
                removeLabels = ["ready to merge", "changes requested"];
              }
            }

            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const names = new Set(current.map((l) => l.name));

            for (const label of removeLabels) {
              if (names.has(label)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: label,
                });
              }
            }

            if (addLabel && !names.has(addLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [addLabel],
              });
            }

            async function thankContributor(pr) {
              const author = pr.user.login;
              if (author.endsWith("[bot]")) {
                return;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });
              if (comments.some((c) => c.body && c.body.includes("<!-- contributor-thanks -->"))) {
                return;
              }

              const message = THANK_YOU_MESSAGES[Math.floor(Math.random() * THANK_YOU_MESSAGES.length)];

              const merged = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "closed",
                per_page: 100,
              });
              const isFirstContribution = !merged.some(
                (p) => p.user.login === author && p.merged_at && p.number !== pr.number
              );

              let body = ["<!-- contributor-thanks -->", message];
              if (isFirstContribution) {
                body.push(
                  "",
                  "This is also your first merged contribution here, which makes it extra special. If you want ideas for a next change, issues labeled `good first issue` are a good place to start. Welcome aboard."
                );
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: body.join("\n"),
              });
            }
