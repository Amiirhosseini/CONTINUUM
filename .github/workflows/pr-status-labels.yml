name: PR Status Labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]

jobs:
  update-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Sync status labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const isReview = context.eventName === "pull_request_review";
            const pr = isReview ? context.payload.review.pull_request : context.payload.pull_request;
            const prNumber = pr.number;

            let addLabel;
            let removeLabels;

            if (isReview) {
              const state = context.payload.review.state;
              if (state === "approved") {
                addLabel = "ready to merge";
                removeLabels = ["awaiting review", "changes requested"];
                await maybeThankFirstTimeContributor(pr);
              } else if (state === "changes_requested") {
                addLabel = "changes requested";
                removeLabels = ["awaiting review", "ready to merge"];
              } else {
                // COMMENT reviews do not change approval status
                return;
              }
            } else {
              const action = context.payload.action;
              if (action === "synchronize") {
                // New commits pushed: approval no longer reflects HEAD
                addLabel = null;
                removeLabels = ["ready to merge"];
              } else {
                // opened or reopened
                addLabel = "awaiting review";
                removeLabels = ["ready to merge", "changes requested"];
              }
            }

            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const names = new Set(current.map((l) => l.name));

            for (const label of removeLabels) {
              if (names.has(label)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: label,
                });
              }
            }

            if (addLabel && !names.has(addLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [addLabel],
              });
            }

            async function maybeThankFirstTimeContributor(pr) {
              const author = pr.user.login;
              if (author.endsWith("[bot]")) {
                return;
              }
              const merged = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "closed",
                per_page: 100,
              });
              const hasEarlierMergedPR = merged.some(
                (p) => p.user.login === author && p.merged_at && p.number !== pr.number
              );
              if (hasEarlierMergedPR) {
                return;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });
              if (comments.some((c) => c.body && c.body.includes("<!-- first-contribution-thanks -->"))) {
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  "<!-- first-contribution-thanks -->",
                  "This PR has been approved and is now labeled `ready to merge`. Thank you for your first contribution to CONTINUUM.",
                  "",
                  "Working through review feedback is exactly how good open source contributions happen, and you saw it through. We hope this is the first of many.",
                  "",
                  "If you want ideas for a next change, issues labeled `good first issue` are a good place to start. Welcome aboard.",
                ].join("\n"),
              });
            }
