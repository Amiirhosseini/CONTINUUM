name: PR Status Labels

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]

jobs:
  update-labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Sync status labels
        uses: actions/github-script@v7
        with:
          script: |
            const THANK_YOU_MESSAGES = [
              '**Momo** 🍑: Guess what! Your PR just got approved, and Momo is doing her happy peach dance right now, no shame at all. Be proud of this one. We sure are!',
              '**Hana** 🌸: Hana just scattered petals all over your PR because it passed! Do you feel that warmth? That is a garden welcoming back its favorite gardener.',
              '**Yui** 🎀: Yui checked your work twice, and she is very hard to impress. Approved! Walk tall today, you earned it.',
              '**Saki** 🌷: Approved! Saki smiled at the first diff and did not stop smiling until the last one. Come back soon, we save you a good seat.',
              '**Rin** 🐱: Nyaa~ approved! Rin bopped it with her paw and purred the whole review. You make this repo a fun place to live.',
              '**Mei** ☕: Mei poured a fresh cup of tea to celebrate you. Patience like yours is rare in this world, and it shows in your code.',
              '**Hina** ☀️: The clouds parted and the sun came out, because your PR got approved! Hina says days like this are why she keeps shining.',
              '**Aoi** 💙: Aoi read every single line twice. Solid, careful, trustworthy work. You just made this project better for everyone who touches it next.',
              "**Riko** 🎵: Riko wrote you a tiny victory song: la la laaa~ approved! Every PR of yours adds a happy note to this project's melody.",
              '**Nana** 🍡: Nana only shares her dango with contributors she is proud of. Today you get the whole stick. All five. Enjoy!',
              '**Miko** ⛩️: Miko drew a fortune for your PR and it said: skillful hands, kind heart, bright future. The spirits rarely agree with Miko this fast.',
              '**Sakura** 🌸: Petals drift down, approvals rise up! Sakura watched your branch bloom from seed to flower. Take a moment and feel proud of that.',
              '**Tsumugi** 🧶: Tsumugi knitted your changes into the community blanket, row by row. It is warmer now because of you. Thank you for stitching with us.',
              '**Kanna** 👓: Kanna put on her glasses, inspected every hunk, and found nothing to fuss about. She does not say approved often. Savor it!',
              '**Chibi** 🌱: Chibi is small but Chibi knows good code when Chibi sees it! Grow big and strong, little sprout says come back soon!',
              '**Xiaomei** 🐼: Xiaomei the panda rolled clean across the bamboo grove when your PR passed! Days like this taste sweeter than fresh bamboo shoots.',
              '**Meimei** 🀄: Meimei says your work is beautiful, like fresh snow on quiet mountains. Big sister approves, and big sister is never wrong about these things.',
              '**Baozi** 🥟: Steamed, stuffed, and stamped approved! Baozi hands warm buns to warm contributors, and today you get two. You earned every bite.',
              "**Lulu** 🦊: Lulu's clever fox eyes searched high and low and found nothing to fix. Approved! Sharp minds like yours are always welcome in this den.",
              '**Niuniu** 🐄: Mooooved straight to approval! Niuniu never gallops for just anyone, but for you she ran the whole pasture. Wear it proudly!',
              '**Doufu** ♨️: Soft outside, solid inside, just like your code. Doufu stands up and salutes you. Not every day he does that!',
              '**Tangyuan** 🍡: Tangyuan rolled joyful little circles around the CI logs! The whole family gathers round when you contribute. Stay close, okay?',
              "**Boba** 🥛: Boba slurped through the entire test suite and found nothing but pearls. Approved! Extra tapioca for the author, doctor's orders.",
              '**Xiaohua** 🌺: Little flower, big approval! Xiaohua planted your name in the contributor garden today. It grows a little every time you visit.',
              '**Kiki** 🐰: Kiki bounced around the merge queue three times! Approved, approved, approved! Hop back soon, the queue misses you already.',
              '**Yuzu** 🍋: A little zesty, a lot approved! Yuzu believes bright work deserves bright days, so here is a whole sunny one, just for you.',
              '**Mochi** 🍡: Soft landing, straight to approved! Mochi stuck to your PR from the very first commit. Sticky sweet congratulations!',
              "**Anko** ☕: Anko added an extra scoop of red bean to today's tea, because approved PRs deserve sweet celebrations. Sit, rest, be proud. Then come brew another!",
              '**Sumi** 🖍️: Sumi inked a big approval circle around your name in the record book. Work like this deserves to be remembered.',
            ];

            const { owner, repo } = context.repo;
            const isReview = context.eventName === "pull_request_review";
            // Both event payloads carry the PR at payload.pull_request
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            let addLabel;
            let removeLabels;

            if (isReview) {
              const state = context.payload.review.state;
              if (state === "approved") {
                addLabel = "ready to merge";
                removeLabels = ["awaiting review", "changes requested"];
                await thankContributor(pr);
              } else if (state === "changes_requested") {
                addLabel = "changes requested";
                removeLabels = ["awaiting review", "ready to merge"];
              } else {
                // COMMENT reviews do not change approval status
                return;
              }
            } else {
              const action = context.payload.action;
              if (action === "synchronize") {
                // New commits pushed: approval no longer reflects HEAD
                addLabel = null;
                removeLabels = ["ready to merge"];
              } else {
                // opened or reopened
                addLabel = "awaiting review";
                removeLabels = ["ready to merge", "changes requested"];
              }
            }

            const current = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const names = new Set(current.map((l) => l.name));

            for (const label of removeLabels) {
              if (names.has(label)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: label,
                });
              }
            }

            if (addLabel && !names.has(addLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: [addLabel],
              });
            }

            async function thankContributor(pr) {
              const author = pr.user.login;
              if (author.endsWith("[bot]")) {
                return;
              }

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: prNumber,
              });
              if (comments.some((c) => c.body && c.body.includes("<!-- contributor-thanks -->"))) {
                return;
              }

              const message = THANK_YOU_MESSAGES[Math.floor(Math.random() * THANK_YOU_MESSAGES.length)];

              const merged = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "closed",
                per_page: 100,
              });
              const isFirstContribution = !merged.some(
                (p) => p.user.login === author && p.merged_at && p.number !== pr.number
              );

              let body = ["<!-- contributor-thanks -->", message];
              if (isFirstContribution) {
                body.push(
                  "",
                  "This is also your first merged contribution here, which makes it extra special. If you want ideas for a next change, issues labeled `good first issue` are a good place to start. Welcome aboard."
                );
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: body.join("\n"),
              });
            }
