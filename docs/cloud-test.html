<!DOCTYPE html>
<html>
<head>
<style>
body { background: #62ACE0; margin: 0; padding: 30px; font-family: sans-serif; }
.cloud-row { display: flex; flex-wrap: wrap; gap: 30px; margin-bottom: 30px; }
.cloud-box { text-align: center; }
.cloud-box h3 { color: #fff; font-size: 14px; margin-bottom: 10px; }
.cloud-test { position: relative; }
.cloud-test svg { display: block; }
.solid path { fill: #000; }
.blur-8 path { fill: rgba(255,255,255,0.55); filter: blur(8px); }
.blur-12 path { fill: rgba(255,255,255,0.5); filter: blur(12px); }
.label { color: #fff; font-size: 12px; margin-top: 5px; }
</style>
</head>
<body>
<h2 style="color:#fff">Cloud Silhouette Tests</h2>

<div class="cloud-row">
  <div class="cloud-box">
    <h3>Current (Fog-like)</h3>
    <div class="cloud-test solid" style="width:200px;height:80px">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M0 64 C0 54, 14 50, 28 52 C38 40, 52 35, 66 38 C76 26, 94 20, 112 22 C128 16, 148 20, 162 26 C175 22, 185 32, 188 44 C190 54, 185 62, 175 66 C162 70, 145 68, 128 69 C112 70, 94 68, 78 69 C62 70, 46 68, 32 67 C14 66, 3 64, 0 65 Z"/>
      </svg>
    </div>
  </div>

  <div class="cloud-box">
    <h3>New (Cartoon Cloud)</h3>
    <div class="cloud-test solid" style="width:200px;height:80px">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 70 C3 62, 12 58, 22 60 C28 48, 40 44, 52 46 C60 35, 75 30, 90 32 C105 24, 125 28, 140 34 C155 28, 170 36, 180 46 C190 52, 198 62, 197 72 C196 80, 188 85, 178 86 C165 88, 148 85, 132 86 C116 88, 100 85, 86 86 C72 88, 58 85, 46 85 C34 86, 22 84, 14 82 C6 80, 3 76, 3 70 Z"/>
      </svg>
    </div>
  </div>
</div>

<h3 style="color:#fff">With Blur Applied</h3>
<div class="cloud-row">
  <div class="cloud-box">
    <div class="cloud-test blur-8" style="width:200px;height:80px">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 70 C3 62, 12 58, 22 60 C28 48, 40 44, 52 46 C60 35, 75 30, 90 32 C105 24, 125 28, 140 34 C155 28, 170 36, 180 46 C190 52, 198 62, 197 72 C196 80, 188 85, 178 86 C165 88, 148 85, 132 86 C116 88, 100 85, 86 86 C72 88, 58 85, 46 85 C34 86, 22 84, 14 82 C6 80, 3 76, 3 70 Z"/>
      </svg>
    </div>
    <div class="label">blur(8px)</div>
  </div>

  <div class="cloud-box">
    <div class="cloud-test blur-12" style="width:200px;height:80px">
      <svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 70 C3 62, 12 58, 22 60 C28 48, 40 44, 52 46 C60 35, 75 30, 90 32 C105 24, 125 28, 140 34 C155 28, 170 36, 180 46 C190 52, 198 62, 197 72 C196 80, 188 85, 178 86 C165 88, 148 85, 132 86 C116 88, 100 85, 86 86 C72 88, 58 85, 46 85 C34 86, 22 84, 14 82 C6 80, 3 76, 3 70 Z"/>
      </svg>
    </div>
    <div class="label">blur(12px)</div>
  </div>
</div>

</body>
</html>
