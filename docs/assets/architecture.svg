<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="CONTINUUM system architecture">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#071827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52758B"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#FF5017"/>
    </marker>
    <style>
      .tier    { fill:#F0F7FC; stroke:#CFE3F2; stroke-width:1.5; }
      .tierSDK { fill:#FFF3EC; stroke:#FFD9C7; stroke-width:1.5; }
      .card    { fill:#FFFFFF; stroke:#E7ECEF; stroke-width:1.5; }
      .cardH   { fill:#FFFFFF; stroke:#FF5017; stroke-width:2; }
      .ttl     { fill:#071827; font-weight:700; }
      .sub     { fill:#6B7D8D; }
      .sub2    { fill:#9AAAB8; }
      .lbl     { fill:#FF5017; font-weight:700; letter-spacing:1.5px; }
      .sdk     { fill:#071827; font-weight:800; letter-spacing:1px; }
      .edge    { stroke:#52758B; stroke-width:2; fill:none; }
      .edgeO   { stroke:#FF5017; stroke-width:2.5; fill:none; }
      .elabel  { fill:#52758B; font-size:10px; }
      .elabelO { fill:#FF5017; font-size:10px; font-weight:600; }
    </style>
  </defs>

  <rect x="0" y="0" width="1080" height="820" fill="#FFFFFF"/>

  <text x="40" y="40" class="lbl" font-size="13">CONTINUUM · SYSTEM ARCHITECTURE</text>

  <!-- ===================== TIER 1: AGENTS & CLIENTS ===================== -->
  <rect class="tier" x="60" y="64" width="960" height="110" rx="16" filter="url(#shadow)"/>
  <text x="80" y="90" class="lbl" font-size="11">AGENTS &amp; CLIENTS</text>

  <rect class="card" x="80"  y="104" width="210" height="56" rx="10"/>
  <text x="96" y="130" class="ttl" font-size="14">Claude Code</text>
  <text x="96" y="150" class="sub" font-size="11">AI coding agent</text>

  <rect class="card" x="310" y="104" width="210" height="56" rx="10"/>
  <text x="326" y="130" class="ttl" font-size="14">LangGraph agent</text>
  <text x="326" y="150" class="sub" font-size="11">graph workflows</text>

  <rect class="card" x="540" y="104" width="210" height="56" rx="10"/>
  <text x="556" y="130" class="ttl" font-size="14">OpenAI agent</text>
  <text x="556" y="150" class="sub" font-size="11">Agents SDK</text>

  <rect class="card" x="770" y="104" width="210" height="56" rx="10"/>
  <text x="786" y="130" class="ttl" font-size="14">Generic Python</text>
  <text x="786" y="150" class="sub" font-size="11">in-process facade</text>

  <path class="edge" d="M540,174 L540,194" marker-end="url(#arrow)"/>

  <!-- ===================== TIER 2: ADAPTERS ===================== -->
  <rect class="tier" x="60" y="196" width="960" height="64" rx="16" filter="url(#shadow)"/>
  <text x="80" y="220" class="lbl" font-size="11">FRAMEWORK ADAPTERS (optional)</text>

  <rect class="card" x="80"  y="224" width="280" height="34" rx="9"/>
  <text x="96"  y="246" class="ttl" font-size="13">LangGraphAdapter</text>

  <rect class="card" x="390" y="224" width="280" height="34" rx="9"/>
  <text x="406" y="246" class="ttl" font-size="13">OpenAIAgentAdapter</text>

  <rect class="card" x="700" y="224" width="280" height="34" rx="9"/>
  <text x="716" y="246" class="ttl" font-size="13">GenericAgentAdapter</text>

  <path class="edge" d="M540,260 L540,286" marker-end="url(#arrow)"/>

  <!-- ===================== TIER 3: CONTINUUM SDK ===================== -->
  <rect class="tierSDK" x="60" y="288" width="960" height="320" rx="16" filter="url(#shadow)"/>
  <text x="80" y="314" class="sdk" font-size="13">CONTINUUM SDK</text>
  <rect x="620" y="300" width="380" height="26" rx="13" fill="#07131E"/>
  <text x="634" y="317" fill="#FFFFFF" font-size="11" font-weight="600">MCP server: deny by default, 9 tools (3 read-only / 6 mutating)</text>

  <!-- Row 1 -->
  <rect class="card" x="80"  y="350" width="280" height="64" rx="10"/>
  <text x="96"  y="376" class="ttl" font-size="14">Extractors</text>
  <text x="96"  y="396" class="sub" font-size="11">deterministic; LLM optional</text>

  <rect class="cardH" x="390" y="350" width="280" height="64" rx="10"/>
  <text x="406" y="376" class="ttl" font-size="14">Event Log</text>
  <text x="406" y="396" class="sub" font-size="11">hash-chained, 29 event types</text>

  <rect class="card" x="700" y="350" width="280" height="64" rx="10"/>
  <text x="716" y="376" class="ttl" font-size="14">Action Ledger</text>
  <text x="716" y="396" class="sub" font-size="11">idempotent side effects</text>

  <!-- Row 2 -->
  <rect class="card" x="80"  y="436" width="280" height="64" rx="10"/>
  <text x="96"  y="462" class="ttl" font-size="14">State Engine</text>
  <text x="96"  y="482" class="sub" font-size="11">projection of events</text>

  <rect class="card" x="390" y="436" width="280" height="64" rx="10"/>
  <text x="406" y="462" class="ttl" font-size="14">Checkpoint Manager</text>
  <text x="406" y="482" class="sub" font-size="11">6 policies (Manual to Hybrid)</text>

  <rect class="card" x="700" y="436" width="280" height="64" rx="10"/>
  <text x="716" y="462" class="ttl" font-size="14">Environment</text>
  <text x="716" y="482" class="sub" font-size="11">snapshot + diff</text>

  <!-- Row 3 -->
  <rect class="card" x="80"  y="522" width="280" height="64" rx="10"/>
  <text x="96"  y="548" class="ttl" font-size="14">Validator</text>
  <text x="96"  y="568" class="sub" font-size="11">staleness propagation</text>

  <rect class="card" x="390" y="522" width="280" height="64" rx="10"/>
  <text x="406" y="548" class="ttl" font-size="14">Recovery Engine</text>
  <text x="406" y="568" class="sub" font-size="11">7 modes, sealed contract</text>

  <rect class="card" x="700" y="522" width="280" height="64" rx="10"/>
  <text x="716" y="548" class="ttl" font-size="14">Security</text>
  <text x="716" y="568" class="sub" font-size="11">hashing, provenance</text>

  <!-- ===================== TIER 4 + 5: STORAGE, EXTERNAL, RESUME ===================== -->
  <path class="edge"  d="M540,608 L360,634" marker-end="url(#arrow)"/>
  <path class="edge"  d="M540,608 L720,634" marker-end="url(#arrow)"/>
  <path class="edgeO" d="M540,608 L540,728" marker-end="url(#arrowO)"/>
  <text x="392" y="620" class="elabel">events + state</text>
  <text x="640" y="620" class="elabel">side effects</text>
  <text x="552" y="676" class="elabelO">resume / recovery</text>

  <rect class="card" x="210" y="636" width="300" height="72" rx="12" filter="url(#shadow)"/>
  <text x="226" y="668" class="ttl" font-size="15">Durable Storage</text>
  <text x="226" y="690" class="sub" font-size="11">SQLite, WAL, synchronous FULL</text>
  <text x="226" y="706" class="sub2" font-size="10">integrity-checked on read</text>

  <rect class="card" x="570" y="636" width="300" height="72" rx="12" filter="url(#shadow)"/>
  <text x="586" y="668" class="ttl" font-size="15">External Systems</text>
  <text x="586" y="690" class="sub" font-size="11">GitHub, email, APIs</text>
  <text x="586" y="706" class="sub2" font-size="10">effects recorded by ledger</text>

  <rect class="card" x="390" y="730" width="300" height="56" rx="12" filter="url(#shadow)"/>
  <text x="406" y="754" class="ttl" font-size="14">Resume</text>
  <text x="406" y="775" class="sub" font-size="11">bounded recovery context</text>

  <text x="540" y="808" text-anchor="middle" class="sub2" font-size="10">SDK uses only the Python standard library; the mcp extra adds the server.</text>
</svg>
