[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "continuum-agent"
version = "0.1.0"
description = "Verifiable semantic recovery layer for long-running AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CONTINUUM contributors" }]
keywords = [
    "ai-agents",
    "durable-execution",
    "checkpointing",
    "recovery",
    "resumable-agents",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
]
# The CLI uses only the standard library: a recovery tool must not fail to
# import when you most need it. No extra is required.

[project.scripts]
continuum = "continuum.cli.main:main"

[project.urls]
Homepage = "https://github.com/continuum-agent/continuum"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum"]
artifacts = ["src/continuum/py.typed"]

[tool.hatch.build.targets.sdist]
exclude = [".venv", "tests", "examples", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
files = ["src/continuum"]

[tool.pydantic.mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["continuum"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false